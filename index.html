<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sage | Supplier Portal</title><style>*{box-sizing:border-box} :root{--ink:#102c2c;--green:#008a3e;--dark:#003c32;--line:#dce5e7;--muted:#596c75}body{margin:0;background:#f3f7f8;color:var(--ink);font:16px/1.5 "Segoe UI",Arial,sans-serif}button,input,select{font:inherit}button,a,input{outline-offset:4px}button{cursor:pointer}header{height:76px;background:linear-gradient(105deg,#002c27,#004c3c);color:white;display:flex;align-items:center;padding:0 4.5%;gap:22px}.logo{font-size:36px;letter-spacing:-3px;color:#00e568;text-decoration:none;font-weight:600}.divider{height:28px;border-left:1px solid #4e7b70}.header-right{margin-left:auto;display:flex;align-items:center;gap:30px;font-size:14px}.help{color:inherit;background:none;border:0}.avatar{display:grid;place-items:center;border-radius:50%;background:#ecf5f3;color:#234c43;width:35px;height:35px;font-size:12px;font-weight:700}.demo-bar{background:white;border-bottom:1px solid var(--line);padding:11px 4.5%;display:flex;align-items:center;justify-content:space-between;font-size:12px;letter-spacing:1px;color:#47625d}.demo-bar i{display:inline-block;width:7px;height:7px;background:#04a15a;border-radius:100%;margin-right:7px}.demo-note{letter-spacing:0;color:#738681;margin-left:15px}.demo-bar button{font-size:13px;border:0;background:#edf5f1;padding:7px 12px;border-radius:5px;color:#245e48;letter-spacing:0}.demo-bar button span{margin-left:15px}main{max-width:1190px;margin:0 auto;padding:45px 32px 65px;min-height:calc(100vh - 208px)}h1{font-size:30px;line-height:1.25;letter-spacing:-.7px;margin:7px 0 10px}h2{font-size:19px;margin:0 0 7px}p{margin:0 0 20px}.subtle{color:var(--muted)}.eyebrow{font-size:13px;letter-spacing:1.3px;color:#55736c;font-weight:600;text-transform:uppercase}.page-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:27px}.page-top p{margin:0;color:var(--muted)}. :5px 0 0;font-size:15px}.error-text{color:#b52739;font-size:13px;margin:12px 0 0;min-height:0}.error-text:empty{display:none}footer{border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;padding:21px 4.5%;font-size:12px;color:#708480;background:white}#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#003e30;color:white;padding:13px 24px;border-radius:8px;box-shadow:0 4px 22px #002e3133;display:none;z-index:10}dialog{border:1px solid var(--line);border-radius:12px;padding:30px;max-width:750px;width:calc(100% - 40px);color:var(--ink);box-shadow:0 20px 90px #001f2640}dialog::backdrop{background:#092f3966;backdrop-filter:blur(3px)}.dialog-top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:15px}.close{border:0;background:#f1f5f4;width:34px;height:34px;border-radius:50%;font-size:21px;color:#48635c}.scenario-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.scenario{display:block;background:white;text-align:left;border:1px solid var(--line);border-radius:7px;padding:14px;color:var(--ink)}.scenario:hover{background:#eef8f1;border-color:#008d45}.scenario span{font-size:13px;color:#6b7f85;display:block;margin-top:3px}.space-top{margin-top:24px}.change-highlight{color:#bd3345;font-weight:600}.card-note{border-top:1px solid var(--line);padding-top:18px}.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(min-width:1500px){main{padding-top:65px}}@media(max-width:1050px){.status-grid{grid-template-columns:230px 1fr}.timeline-card{grid-column:1/-1}.timeline{display:flex;gap:50px}.timeline li:not(:last-child):before{display:none}.review-grid{grid-template-columns:1fr}.review-grid>div+div{padding-left:0;border-left:0}.demo-note{display:none}}@media(max-width:720px){header{height:65px;gap:12px;padding:0 20px}.header-right{gap:10px}.header-right>span:first-child{display:none}main{paddi <body><header><a class="logo" href="#" aria-label="Sage supplier portal home">Sage</a><span class="divider"></span><span>Supplier Portal</span><div class="header-right"><span>Acme Corporation</span><button class="help" data-action="help">ⓘ &nbsp;Help</button><span class="avatar">JD</span></div></header><div class="demo-bar"><span><i></i> INTERACTIVE PROTOTYPE <span class="demo-note">Sample data · no real payments or emails</span></span><button data-action="scenarios">Explore scenarios <span>⌘</span></button></div><main id="app"></main><footer><span>© Sage 2026</span><span>Secure. Simple. In control.</span><span>Supplier Portal</span></footer><div id="toast" role="status"></div><dialog id="modal"></dialog><script>const $=s=>document.querySelector(s), app=$('#app'), modal=$('#modal');
const seed={holder:'ABC Supplies Inc.',routing:'021000021',account:'123457392',confirm:'123457392',type:'Checking',method:'ACH (Direct deposit)'};
let draft=null;try{draft=JSON.parse(sessionStorage.getItem('sage-draft'))}catch{}
let state={screen:'email',email:'jane@supplier.example',details:{...seed,...draft},approved:{...seed,account:'987654420'},submitted:null,correcting:false};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const btn=(text,action,primary=false)=>`<button class="button ${primary?'primary':''}" data-action="${action}">${text}</button>`;
function toast(msg){$('#toast').textContent=msg;$('#toast').style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').style.display='none',3500)}
function go(screen){state.screen=screen;render();window.scrollTo(0,0);app.setAttribute('tabindex','-1');app.focus({preventScroll:true})}
function badge(status){return `<span class="badge ${status==='In Progress'?'progress':status==='Active'?'active':status==='Action Required'?'action':status==='Inactive'?'inactive':''}">${status}</span>`}
function pageHeading(title,sub,status){return `<div class="page-top"><div><div class="eyebrow">ABC Supplies Inc.</div><h1>${title}</h1><p>${sub}</p></div>${badge(status)}</div>`}
function warning(pending=false){return `<div class="alert"><b aria-hidden="true">⚠</b><span>${pending?'Your changes are awaiting approval. Payments may still go to your current account.':'Changes are not immediate. Your current payment details remain in use until Acme Corporation approves your changes.'}</span></div>`}
function company(){return `<aside class="card company"><div class="company-icon" aria-hidden="true">▤</div><h2>Company information</h2><div class="lock">▣ &nbsp;Read-only · Provided by Acme Corporation</div><dl><dt>Business name</dt><dd><strong>ABC Supplies Inc.</strong></dd><dt>Address</dt><dd>125 Market Street<br>Boston, MA 02110<br>United States</dd></dl></aside>`}
function steps(n){return `<div class="steps"><div class="step current"><span>${n===2?'✓':'1'}</span>Supplier &amp; payment details</div><div class="step-line"></div><div class="step ${n===2?'current':''}"><span>2</span>Review and submit</div></div>`}
function auth(otp=false){return `<section class="card auth"><div class="logo">Sage</div><h1>${otp?'Enter your verification code':'Access your supplier portal'}</h1><p class="subtle">${otp?`We’ve sent a 6-digit code to<br><strong>${esc(state.email)}</strong>`:'For Acme Corporation'}</p>${otp?`<form id="otp-form"><div class="otp" role="group" aria-label="Six digit verification code">${Array.from({length:6},(_,i)=>`<input aria-label="Digit ${i+1}" inputmode="numeric" pattern="[0-9]" maxlength="1" autocomplete="${i===0?'one-time-code':'off'}" required>`).join('')}</div><p class="error-text" id="otp-error" role="alert"></p><button class="button primary full" type="submit">Verify and continue</button></form><div class="otp-links"><button class="text-button" data-action="resend">Resend code</button><button class="text-button" data-action="email">Change email</button></div><div class="demo-code">Demo verification code: <strong>123456</strong><br><small>The code is simulated for this prototype.</small></div>`:`<form id="email-form"><div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" value="${esc(state.email)}" required></div><button class="button primary full" type="submit">Send verification code</button></form><p class="hint space-top">Use the email address registered with Acme Corporation.</p>`}<div class="secure">▣ &nbsp; Never share your verification code.</div></section><div class="auth-foot">Your details. Protected every step of the way.</div>`}
function field(label,key,{secret=false,pattern='',hint='',max=''}={}){return `<div class="field"><label for="${key}">${label} <span class="req">*</span></label><div class="input-wrap"><input id="${key}" name="${key}" value="${esc(state.details[key])}" type="${secret?'password':'text'}" ${pattern?`pattern="${pattern}" inputmode="numeric"`:''} ${max?`maxlength="${max}"`:''} required ${key==='holder'?'autocomplete="organization"':'autocomplete="off"'}>${secret?`<button type="button" class="eye" data-reveal="${key}" aria-label="Show ${label.toLowerCase()}">◉</button>`:''}</div>${hint?`<div class="hint">${hint}</div>`:''}</div>`}
function edit(){return `${pageHeading(state.correcting?'Correct your payment details':'Supplier & payment details','Step 1 of 2 · Keep your payment information up to date.','In Progress')}${steps(1)}${warning()}${state.correcting?'<div class="alert error"><b>!</b><span><strong>Please check the account holder name.</strong><br>Acme Corporation: Please correct the account holder name to match your bank records.</span></div>':''}<div class="grid">${company()}<section class="card"><h2>Payment details</h2><p class="hint">One bank account per vendor. Fields marked <span class="req">*</span> are required.</p><form id="details-form"><div class="form-grid">${field('Account holder name','holder')}${field('Routing number','routing',{pattern:'[0-9]{9}',max:9,hint:'Enter the 9-digit US routing number.'})}${field('Account number','account',{secret:true,pattern:'[0-9]{4,17}',max:17})}${field('Confirm account number','confirm',{secret:true,pattern:'[0-9]{4,17}',max:17})}</div><div class="field space-top"><label>Account type <span class="req">*</span></label><div class="radios">${['Checking','Savings'].map(x=>`<label><input type="radio" name="type" value="${x}" ${state.details.type===x?'checked':''}>${x}</label>`).join('')}</div></div><p class="error-text" id="form-error" role="alert"></p><div class="actions"><button class="button" type="button" data-action="save">Save draft</button><button class="button primary" type="submit">Continue to review</button></div></form></section></div><div class="security-row"><span class="secure">▣ &nbsp; Bank details are encrypted when stored.</span><span class="hint">For company information changes, contact Acme Corporation.</span></div>`}
function masked(v){return '••••••'+String(v).slice(-4)}
function comparison(action=false){return `<table><thead><tr><th></th><th>Current approved</th><th>${action?'Your proposed changes':'Proposed'}</th></tr></thead><tbody>${[['Account holder name','holder'],['Routing number','routing'],['Account number','account'],['Account type','type']].map(([label,key])=>`<tr><td>${label}</td><td>${esc(key==='routing'||key==='account'?masked(state.approved[key]):state.approved[key])}</td><td class="${action&&key==='holder'?'change-highlight':''}">${esc(key==='routing'||key==='account'?masked(state.details[key]):state.details[key])}${action&&key==='holder'?'<br><small>Correction needed</small>':''}</td></tr>`).join('')}</tbody></table>`}
function review(){return `${pageHeading('Review your payment details','Step 2 of 2 · Check your changes before submitting.','In Progress')}${steps(2)}${warning()}<section class="card"><div class="review-grid"><div><h2>Payment method</h2><p class="hint">Available methods depend on your payment provider.</p>${['ACH (Direct deposit)','Check'].map((x,i)=>`<label class="method"><input type="radio" name="method" value="${x}" ${state.details.method===x?'checked':''}><span><strong>${x}</strong><small>${i?'Payments will be sent to your business address.':'Payments are deposited directly to your bank account.'}</small></span></label>`).join('')}</div><div><div class="review-title"><h2>Review proposed changes</h2><button class="text-button" data-action="edit">Edit</button></div>${comparison()}<p class="hint">ⓘ &nbsp;Format checks do not confirm bank account validity.</p></div></div><div class="actions">${btn('Previous','edit')}${btn('Save draft','save')}${btn(state.correcting?'Resubmit for approval':'Submit for approval','submit',true)}</div></section><div class="secure space-top">▣ &nbsp; Your current account stays in use until your changes are approved.</div>`}
function draftView(){return `${pageHeading('Your draft is saved','You can come back and finish whenever you’re ready.','In Progress')}${warning()}<div class="grid">${company()}<section class="card"><div class="review-title"><div><h2>Draft payment details</h2><p class="hint">Not yet submitted for approval.</p></div><span class="badge active">✓ Draft saved</span></div>${detailsList(state.details,false)}<div class="actions">${btn('Continue editing','edit',true)}</div></section></div>`}
function detailsList(data,method=true){return `<dl class="approved-details">${[['Account holder name','holder'],['Routing number','routing'],['Account number','account'],['Account type','type'],...(method?[['Payment method','method']]:[])].map(([l,k])=>`<div><dt>${l}</dt><dd>${esc(k==='routing'||k==='account'?masked(data[k]):data[k])}</dd></div>`).join('')}</dl>`}
function success(){return `${pageHeading('Submission received','Your proposed changes have been sent to Acme Corporation.','Pending AP Review')}${warning()}<section class="card success"><div class="check">✓</div><h1>Submitted for approval</h1><p class="subtle">Acme Corporation must approve these changes before they take effect.</p>${btn('View submission','pending',true)}<div class="hint">No further action is required while your submission is under review.</div></section>`}
function timeline(status){return `<aside class="card timeline-card"><h2>Status timeline</h2><ol class="timeline"><li class="done"><strong>${state.correcting?'Resubmitted':'Submitted'}</strong><small>${esc(state.submitted||'19 Nov 2026, 10:42')}<br>${esc(state.email)}</small></li>${status==='Pending AP Review'?'<li><strong>Awaiting review</strong><small>Acme Corporation</small></li>':status==='Action Required'?'<li class="done"><strong>Returned for correction</strong><small>19 Nov 2026, 11:15<br>Please correct the account holder name.</small></li>':'<li class="done"><strong>Approved</strong><small>19 Nov 2026, 14:21<br>Acme Corporation</small></li>'}</ol></aside>`}
function statusView(kind){let status=kind==='pending'?'Pending AP Review':kind==='action'?'Action Required':kind==='inactive'?'Inactive':'Active';return `${pageHeading('Your supplier account',kind==='pending'?'Track the progress of your payment details.':kind==='action'?'Your payment changes need a small correction.':'Manage your company and payment information.',status)}${kind==='pending'||kind==='action'?warning(true):kind==='active'||kind==='card'?'<div class="alert" style="background:#ecf8f0;border-color:#c6e6d2;color:#24603e"><b style="color:#008a3e">✓</b>Your approved payment details are now active.</div>':''}${kind==='action'?'<div class="alert error"><b>!</b><span><strong>Changes need your attention</strong><br>Reason from Acme Corporation: Please correct the account holder name to match your bank records.</span></div>':''}<div class="${kind==='inactive'||kind==='card'?'grid':'status-grid'}">${company()}${kind==='inactive'?'<section class="card"><div class="info-panel"><h2>This vendor portal is inactive</h2><p style="margin:0">Contact Acme Corporation for assistance.</p></div></section>':kind==='card'?`<section class="card"><h2>Payment method</h2><div class="info-panel space-top"><h2>▣ &nbsp; Virtual card — Assigned by provider</h2><p class="hint">Virtual card enrollment is managed by your payment provider.</p><dl class="approved-details"><div><dt>Card reference</dt><dd>•••• •••• •••• 5687</dd></div><div><dt>Status</dt><dd>Assigned</dd></div></dl></div><p class="hint space-top">For questions about your virtual card, contact Acme Corporation.</p></section>`:`<section class="card"><h2>${kind==='active'?'Approved payment details':'Payment details'}</h2>${kind==='active'?detailsList(state.approved):comparison(kind==='action')}<div class="card-note hint">${kind==='active'?'ⓘ For questions about your information, contact Acme Corporation.':'Your current approved details remain in use during review.'}</div>${kind==='action'?`<div class="actions">${btn('Correct and resubmit','correct',true)}</div>`:kind==='active'?`<div class="actions">${btn('Update payment details','update',true)}</div>`:''}</section>${timeline(status)}`}</div>${kind==='pending'?'<div class="space-top hint">You’ll receive an email when Acme Corporation reviews your submission. Use “Explore scenarios” to preview the outcome.</div>':''}`}
function preaccess(invited){return `${pageHeading('Supplier portal access','Your company’s access to Acme Corporation. ',invited?'Invited':'Not invited')}<div class="grid">${company()}<section class="card"><div class="info-panel"><h2>${invited?'Awaiting first verified access':'Portal access has not yet been invited'}</h2><p>${invited?'You have been invited to access the supplier portal. Sign in with your email address to get started.':'You will be able to access the supplier portal once Acme Corporation enables access.'}</p>${invited?btn('Verify email and get started','email',true):'<span class="hint">Contact your Acme Corporation representative for assistance.</span>'}</div></section></div>`}
function render(){const s=state.screen;app.innerHTML=s==='email'?auth():s==='otp'?auth(true):s==='edit'?edit():s==='review'?review():s==='draft'?draftView():s==='success'?success():s==='invited'||s==='notinvited'?preaccess(s==='invited'):statusView(s);bindForms()}
function readDetails(){const f=$('#details-form');if(f){const fd=new FormData(f);for(const k of ['holder','routing','account','confirm','type'])state.details[k]=String(fd.get(k)||'').trim()}const m=$('input[name="method"]:checked');if(m)state.details.method=m.value}
function bindForms(){const ef=$('#email-form');if(ef)ef.onsubmit=e=>{e.preventDefault();state.email=$('#email').value.trim();go('otp');$('.otp input').focus()};const of=$('#otp-form');if(of){of.onsubmit=e=>{e.preventDefault();if([...document.querySelectorAll('.otp input')].map(x=>x.value).join('')!=='123456'){$('#otp-error').textContent='That code doesn’t match. Try 123456 for this demo.';return}go(draft?'draft':'edit')};const inputs=[...document.querySelectorAll('.otp input')];inputs.forEach((input,i)=>{input.oninput=()=>{input.value=input.value.replace(/\D/g,'').slice(-1);if(input.value&&inputs[i+1])inputs[i+1].focus()};input.onkeydown=e=>{if(e.key==='Backspace'&&!input.value&&inputs[i-1])inputs[i-1].focus()};input.onpaste=e=>{const digits=e.clipboardData.getData('text').replace(/\D/g,'').slice(0,6);if(digits){e.preventDefault();digits.split('').forEach((c,j)=>inputs[j].value=c);inputs[Math.min(digits.length,5)].focus()}}})}const df=$('#details-form');if(df)df.onsubmit=e=>{e.preventDefault();readDetails();if(state.details.account!==state.details.confirm){$('#form-error').textContent='Account numbers don’t match. Please check both fields.';$('#confirm').focus();return}if(!state.details.holder){$('#form-error').textContent='Enter the name shown on your bank account.';return}go('review')};document.querySelectorAll('[data-reveal]').forEach(b=>b.onclick=()=>{const i=document.getElementById(b.dataset.reveal);i.type=i.type==='password'?'text':'password';b.setAttribute('aria-label',`${i.type==='password'?'Show':'Hide'} ${i.id==='confirm'?'confirmation':'account number'}`)})}
const scenarios=[['email','Portal access','Start the full journey'],['otp','Verify email','Enter a demo verification code'],['edit','Supplier & payment details','Edit bank account details'],['draft','Saved draft','Resume an unfinished update'],['review','Payment method & review','Review and submit changes'],['success','Submission received','Confirmation of submission'],['pending','Pending AP Review','See the approval timeline'],['action','Action Required','Correct and resubmit details'],['active','Active','View approved payment details'],['inactive','Inactive','Access unavailable'],['notinvited','Not invited','Access not enabled yet'],['invited','Invited','First-time verified access'],['card','Assigned virtual card','Provider-managed payment method']];
function showScenarios(){readDetails();modal.innerHTML=`<div class="dialog-top"><div><div class="eyebrow">Prototype controls</div><h2>Explore the supplier journey</h2></div><button class="close" data-action="close" aria-label="Close">×</button></div><p class="subtle">Jump to any screen, or start with portal access for the complete experience.</p><div class="scenario-grid">${scenarios.map(([s,t,d])=>`<button class="scenario" data-screen="${s}"><strong>${t}</strong><span>${d}</span></button>`).join('')}</div><div class="actions">${btn('Reset prototype','reset')}</div>`;modal.showModal()}
document.addEventListener('click',e=>{const scenario=e.target.closest('[data-screen]');if(scenario){const s=scenario.dataset.screen;modal.close();state.correcting=s==='action';if(s==='action')state.details.holder='Acme Supplies LLC';go(s);return}const a=e.target.closest('[data-action]')?.dataset.action;if(!a)return;e.preventDefault();if(a==='scenarios')showScenarios();else if(a==='close')modal.close();else if(a==='help'){modal.innerHTML=`<div class="dialog-top"><h2>How can we help?</h2><button class="close" data-action="close" aria-label="Close">×</button></div><p>For questions about your company, portal access, or payment approval, contact your Acme Corporation accounts payable representative.</p><div class="info-panel"><strong>Trying the prototype?</strong><p style="margin:8px 0 0">Use verification code <strong>123456</strong>. Enter sample bank details, save a draft, then submit for approval. “Explore scenarios” lets you preview approval, corrections, and all access states.</p></div>`;modal.showModal()}else if(a==='resend')toast('A new demo code has been sent. Use 123456.');else if(a==='save'){readDetails();draft={...state.details};try{sessionStorage.setItem('sage-draft',JSON.stringify(draft))}catch{}go('draft');toast('Draft saved for this browser session.')}else if(a==='submit'){readDetails();state.submitted=new Intl.DateTimeFormat('en-GB',{dateStyle:'medium',timeStyle:'short',timeZone:'Europe/London'}).format(new Date());draft=null;try{sessionStorage.removeItem('sage-draft')}catch{}go('success')}else if(a==='correct'){state.correcting=true;go('edit')}else if(a==='update'){state.correcting=false;state.details={...state.approved,confirm:state.approved.account};go('edit')}else if(a==='reset'){draft=null;try{sessionStorage.removeItem('sage-draft')}catch{}state={screen:'email',email:'jane@supplier.example',details:{...seed},approved:{...seed,account:'987654420'},submitted:null,correcting:false};modal.close();go('email');toast('Prototype reset.')}else{readDetails();go(a)}});
modal.addEventListener('click',e=>{if(e.target===modal){const r=modal.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)modal.close()}});
render();

</script></body></html>
